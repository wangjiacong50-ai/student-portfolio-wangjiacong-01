name: Upgrade original portfolio to v1.3.2

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DEPLOY-V1.3.2 to run the in-place production upgrade
        required: true
        type: string
  push:
    branches:
      - main
    paths:
      - .github/upgrade-v1.3.2-trigger.txt

permissions:
  contents: write

concurrency:
  group: student-portfolio-wangjiacong-01-production-upgrade
  cancel-in-progress: false

jobs:
  upgrade:
    if: ${{ github.event_name == 'push' || inputs.confirmation == 'DEPLOY-V1.3.2' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 4a11cb74ae1ab91142ac7e73b4f64cf3
      ORIGINAL_COMMIT: 5c9d2032ba309d64c9069c279d876e4cc7cc4429
      RELEASE_COMMIT: a7f0b7e9b8be4bea692c0e8724856b914421aa43
      EXPECTED_TREE: 6e4e002043900c317b35f14c76aca42648309551
      EXPECTED_WRANGLER_SHA256: 66f5eb7cd1e1c490a84875de761e9fb0e1eb913a3a4975f651803520ed29e7bd
      SITE_ORIGIN: https://student-portfolio-wangjiacong-01.wangjiacong50.workers.dev

    steps:
      - name: Check required secret
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo "Repository secret CLOUDFLARE_API_TOKEN is missing." >&2
            exit 1
          fi

      - name: Check out original repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: site

      - name: Prepare exact v1.3.2 upgrade branch
        shell: bash
        working-directory: site
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$ORIGINAL_COMMIT" HEAD
          git diff --exit-code "$ORIGINAL_COMMIT" HEAD -- . \
            ':(exclude).github/workflows/upgrade-v1.3.2.yml' \
            ':(exclude).github/upgrade-v1.3.2-trigger.txt'
          cp wrangler.jsonc "$RUNNER_TEMP/original-wrangler.jsonc"
          test "$(sha256sum "$RUNNER_TEMP/original-wrangler.jsonc" | awk '{print $1}')" = "$EXPECTED_WRANGLER_SHA256"
          git remote add verified-release https://github.com/q1433031046-ship-it/student-portfolio-cloudflare.git
          git fetch --no-tags verified-release refs/tags/v1.3.2
          test "$(git rev-parse FETCH_HEAD^{commit})" = "$RELEASE_COMMIT"
          git switch --force-create codex/upgrade-v1.3.2 "$ORIGINAL_COMMIT"
          git rm -r --quiet .
          git archive "$RELEASE_COMMIT" | tar -x
          cp "$RUNNER_TEMP/original-wrangler.jsonc" wrangler.jsonc
          git add -A
          test "$(git write-tree)" = "$EXPECTED_TREE"
          node <<'NODE'
          const { createHash } = require('node:crypto');
          const { readFileSync } = require('node:fs');
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const upgrade = JSON.parse(readFileSync('deployment/upgrade-prompt.json', 'utf8'));
          const expected = '6a8800657b8da767edeae0d4c5c6e78d5397dae8ba0f6fb6cd3775dfa021ae4b';
          const actual = createHash('sha256').update(upgrade.prompt, 'utf8').digest('hex');
          if (pkg.version !== '1.3.2' || upgrade.promptVersion !== '1.3.2' || upgrade.releaseTag !== 'v1.3.2') {
            throw new Error('Frozen release metadata is not v1.3.2');
          }
          if (upgrade.promptSha256 !== expected || actual !== expected) {
            throw new Error('upgrade-prompt fingerprint mismatch');
          }
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Prepare verified upgrade to formal v1.3.2"
          git fetch origin refs/heads/codex/upgrade-v1.3.2:refs/remotes/origin/codex/upgrade-v1.3.2 || true
          git push --force-with-lease origin HEAD:refs/heads/codex/upgrade-v1.3.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install locked dependencies
        working-directory: site
        run: npm ci

      - name: Capture live public baseline
        shell: bash
        working-directory: site
        run: |
          set -euo pipefail
          mkdir -p .wrangler/upgrade-receipt
          curl --fail --silent --show-error "$SITE_ORIGIN/api/version" > .wrangler/upgrade-receipt/version-before.json
          curl --fail --silent --show-error "$SITE_ORIGIN/api/portfolio" > .wrangler/upgrade-receipt/portfolio-before.json

      - name: Capture strict pre-upgrade fingerprint
        working-directory: site
        run: npm run cloudflare:fingerprint

      - name: Apply pending migrations and deploy original Worker
        working-directory: site
        run: npm run cloudflare:deploy

      - name: Verify production version and preserve receipts
        shell: bash
        working-directory: site
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error "$SITE_ORIGIN/api/version" > .wrangler/upgrade-receipt/version-after.json; then
              if node -e "const v=require('./.wrangler/upgrade-receipt/version-after.json'); process.exit(v.version==='1.3.2'?0:1)"; then
                break
              fi
            fi
            if [[ "$attempt" = 6 ]]; then
              echo "Production /api/version did not report 1.3.2." >&2
              exit 1
            fi
            sleep 10
          done
          curl --fail --silent --show-error "$SITE_ORIGIN/api/portfolio" > .wrangler/upgrade-receipt/portfolio-after.json
          npx --no-install wrangler d1 execute DB --remote --config wrangler.jsonc \
            --command "SELECT id, name, applied_at FROM d1_migrations ORDER BY id;" --json \
            > .wrangler/upgrade-receipt/d1-migrations-after.json
          sha256sum .wrangler/upgrade-receipt/*.json > .wrangler/upgrade-receipt/SHA256SUMS.txt

      - name: Upload non-secret upgrade receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v1.3.2-upgrade-receipt
          path: |
            site/.wrangler/upgrade-before-fingerprint.json
            site/.wrangler/upgrade-receipt/
          if-no-files-found: warn
          retention-days: 14
