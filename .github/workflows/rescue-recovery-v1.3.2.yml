name: Install one-time rescue recovery verifier

on:
  push:
    branches:
      - main
    paths:
      - .github/rescue-recovery-v1.3.2-trigger.txt

permissions:
  contents: read

concurrency:
  group: student-portfolio-wangjiacong-01-recovery-rescue
  cancel-in-progress: false

jobs:
  rescue:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 4a11cb74ae1ab91142ac7e73b4f64cf3
      RESCUE_HASH: p2.50000.BjGCetJWUxdN6dR1kt4s6XSAlV2llsqrwCZ7kuoZWN8
      RESCUE_SALT: QKKyeGhwGp7t3_hcmQBonMTt

    steps:
      - name: Check required secret
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"

      - name: Check out verified repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install one-time rescue verifier in the original D1
        shell: bash
        run: |
          set -euo pipefail
          npx --no-install wrangler d1 execute DB --remote --config wrangler.jsonc --json \
            --command "SELECT c.password_hash, c.password_salt, c.recovery_hash, c.recovery_salt, s.auth_version, s.confirmed_program_version, (SELECT COUNT(*) FROM admin_credentials) AS credential_count FROM admin_credentials c LEFT JOIN admin_auth_state s ON s.id = c.id WHERE c.id = 'default';" \
            > "$RUNNER_TEMP/credential-before.json"

          npx --no-install wrangler d1 execute DB --remote --config wrangler.jsonc --json \
            --command "UPDATE admin_credentials SET recovery_hash = '$RESCUE_HASH', recovery_salt = '$RESCUE_SALT', recovery_code_created_at = strftime('%Y-%m-%dT%H:%M:%fZ','now'), updated_at = strftime('%Y-%m-%dT%H:%M:%fZ','now') WHERE id = 'default' AND (SELECT COUNT(*) FROM admin_credentials) = 1 AND EXISTS (SELECT 1 FROM admin_auth_state WHERE id = 'default' AND auth_version = 2 AND COALESCE(confirmed_program_version, '') <> '1.3.2');" \
            > "$RUNNER_TEMP/recovery-update.json"

          npx --no-install wrangler d1 execute DB --remote --config wrangler.jsonc --json \
            --command "SELECT c.password_hash, c.password_salt, c.recovery_hash, c.recovery_salt, s.auth_version, s.confirmed_program_version, (SELECT COUNT(*) FROM admin_credentials) AS credential_count FROM admin_credentials c LEFT JOIN admin_auth_state s ON s.id = c.id WHERE c.id = 'default';" \
            > "$RUNNER_TEMP/credential-after.json"

          node <<'NODE'
          const { readFileSync } = require("node:fs");
          function firstRow(path) {
            const parsed = JSON.parse(readFileSync(path, "utf8"));
            const entries = Array.isArray(parsed) ? parsed : [parsed];
            return entries.flatMap((entry) => entry.results ?? [])[0] ?? null;
          }
          const before = firstRow(process.env.RUNNER_TEMP + "/credential-before.json");
          const after = firstRow(process.env.RUNNER_TEMP + "/credential-after.json");
          if (!before || !after) throw new Error("Unable to read the credential row");
          if (Number(before.credential_count) !== 1 || Number(before.auth_version) !== 2) {
            throw new Error("Unexpected administrator credential state");
          }
          if (before.confirmed_program_version === "1.3.2") {
            throw new Error("Upgrade confirmation was already completed; rescue write refused");
          }
          if (before.password_hash !== after.password_hash || before.password_salt !== after.password_salt) {
            throw new Error("Password credential changed unexpectedly");
          }
          if (after.recovery_hash !== process.env.RESCUE_HASH || after.recovery_salt !== process.env.RESCUE_SALT) {
            throw new Error("Rescue recovery verifier was not installed");
          }
          if (after.confirmed_program_version === "1.3.2") {
            throw new Error("Program confirmation changed unexpectedly");
          }
          console.log("One-time rescue recovery verifier installed; portfolio data and password were not changed.");
          NODE
